name: Publish Rust crate

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
      - if: "startsWith(github.ref, 'refs/tags/xz-') && !startsWith(github.ref, 'refs/tags/xz-sys')"
        name: Publish xz crate
        run: cargo publish
        working-directory: .
        env:
          CARGO_REGISTRY_TOKEN: "${{ secrets.CRATES_IO_API_KEY }}"
